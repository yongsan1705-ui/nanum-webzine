<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>DB 미리보기 (시연 모드) | 웹진 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../nanum/assets/css/style.css">
</head>
<body class="admin">
  <div class="test-bar">시연용 DB 미리보기 · 서버 없이 이 브라우저에 쌓인 시연 데이터만 보여 줍니다 · 업체에 보내지 않는 파일입니다</div>
  <header class="site-header"><div class="wrap admin-header"><a class="brand" href="../nanum/index.html"><small>센트럴서울안과 소식지</small><strong>웹진 관리자 (미리보기)</strong></a></div></header>
  <main id="main"><section class="section dash"><div class="wrap" id="root"></div></section></main>

  <script src="../build/data.js"></script>
  <script>
  // 실제 서버의 DB 페이지(nanum/admin/index.php)와 같은 집계 방식을 브라우저 데이터로 흉내 냅니다.
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const KEY = "nanum-store-v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { events: [], consults: [], subscribers: [] }; } catch { return { events: [], consults: [], subscribers: [] }; } };
  const label = id => (ARTICLES.find(a => a.id === id) || {}).kicker || "메인·직접 접속";
  const time = ts => new Date(ts).toLocaleString("ko-KR");
  const fmt = s => s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`;

  function render() {
    const d = load(), ev = d.events;
    const cnt = (t, id) => ev.filter(e => e.type === t && (id === undefined || e.article === id)).length;
    const rows = ARTICLES.map(a => {
      const views = cnt("view", a.id);
      const perView = {};
      ev.filter(e => e.type === "dwell" && e.article === a.id).forEach(e => { perView[e.view_id] = Math.max(perView[e.view_id] || 0, +e.value); });
      const dw = Object.values(perView);
      const reach = new Set(ev.filter(e => e.type === "scroll" && e.article === a.id && +e.value === 100).map(e => e.view_id)).size;
      return { a, views, dwell: dw.length ? Math.round(dw.reduce((x, y) => x + y, 0) / dw.length) : 0, reach: views ? Math.round(reach / views * 100) : 0,
        click: cnt("consult_click", a.id), submit: cnt("consult_submit", a.id), sub: cnt("subscribe", a.id), share: cnt("share", a.id) };
    }).sort((x, y) => y.views - x.views);
    const tv = cnt("view"), tc = cnt("consult_click"), ts = cnt("consult_submit"), max = Math.max(tv, 1);
    const sources = {};
    ev.filter(e => e.type === "view").forEach(e => { sources[e.source] = (sources[e.source] || 0) + 1; });

    document.getElementById("root").innerHTML = `
      <div class="dash-head"><h1 class="page-title">통계</h1><div class="dash-actions"><button class="tool" id="refresh">새로고침</button><button class="tool danger" id="reset">시연 데이터 지우기</button></div></div>
      <div class="kpis">
        <div><span>기사 조회</span><strong>${tv}</strong></div><div><span>상담 클릭</span><strong>${tc}</strong></div>
        <div><span>상담 신청</span><strong>${d.consults.length}</strong></div><div><span>웹진 신청</span><strong>${d.subscribers.length}</strong></div>
        <div><span>공유</span><strong>${cnt("share")}</strong></div>
      </div>
      <h2>상담 전환 경로</h2><div class="funnel">${[["기사 조회", tv], ["상담받기 클릭", tc], ["상담 신청 제출", ts]].map(([l, n]) => `<div class="f-row"><span>${l}</span><div class="f-bar"><i style="width:${n / max * 100}%"></i></div><b>${n}</b></div>`).join("")}</div>
      <h2>기사별 성과</h2><div class="table-wrap"><table><thead><tr><th>기사</th><th>조회</th><th>평균 체류</th><th>끝까지 읽음</th><th>상담 클릭</th><th>상담 신청</th><th>웹진 신청</th><th>공유</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td><a href="../nanum/${r.a.id}.html">${esc(r.a.kicker)}</a></td><td>${r.views}</td><td>${fmt(r.dwell)}</td><td>${r.reach}%</td><td>${r.click}</td><td>${r.submit}</td><td>${r.sub}</td><td>${r.share}</td></tr>`).join("")}
      </tbody></table></div>
      <h2>유입 경로</h2>${Object.keys(sources).length ? `<ul class="sources">${Object.entries(sources).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<li><span>${esc(s)}</span><b>${n}</b></li>`).join("")}</ul>` : `<p class="muted">아직 데이터가 없습니다.</p>`}
      <h2>상담 신청 (${d.consults.length}건)</h2>${d.consults.length ? `<div class="table-wrap"><table><thead><tr><th>접수 시각</th><th>이름</th><th>연락처</th><th>관심 진료과목</th><th>문의 내용</th><th>신청 기사</th><th>유입</th></tr></thead><tbody>
        ${d.consults.slice().reverse().map(c => `<tr><td>${time(c.ts)}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.field)}</td><td class="msg">${esc(c.message || "-")}</td><td>${esc(label(c.article))}</td><td>${esc(c.source)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">접수 내역이 없습니다.</p>`}
      <h2>웹진 신청 (${d.subscribers.length}명)</h2>${d.subscribers.length ? `<div class="table-wrap"><table><thead><tr><th>신청 시각</th><th>이메일</th><th>이름</th><th>신청 기사</th></tr></thead><tbody>
        ${d.subscribers.slice().reverse().map(s => `<tr><td>${time(s.ts)}</td><td>${esc(s.email)}</td><td>${esc(s.name || "-")}</td><td>${esc(label(s.article))}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">신청 내역이 없습니다.</p>`}
      <p class="muted">실제 서버의 DB 페이지(nanum/admin/)에는 로그인, 상담 상태·메모, 삭제·파기, 구독 해지, CSV 내보내기, 접속 기록, 관리자 계정 관리가 추가로 있습니다.</p>`;
    document.getElementById("refresh").onclick = render;
    document.getElementById("reset").onclick = () => { if (confirm("시연 데이터를 모두 지울까요?")) { localStorage.removeItem(KEY); render(); } };
  }
  render();
  </script>
</body>
</html>
